<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zebra RFID Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevents text selection which can be annoying on handhelds during rapid interaction */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overscroll-behavior: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans flex flex-col h-screen overflow-hidden">

    <!-- Header / Status Bar -->
    <header class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center shrink-0">
        <div>
            <h1 class="text-xl font-bold tracking-tight">RFID Scanner</h1>
            <p id="eb-status" class="text-xs text-slate-400">Scanner: 192.168.1.249</p>
        </div>
        <div id="rfid-status-indicator" class="flex items-center gap-2">
            <span class="text-xs font-medium uppercase">Backend</span>
            <div id="status-dot" class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
        </div>
    </header>

    <!-- Main Content / Controls -->
    <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
        
        <!-- Hero Action Section -->
        <section class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl flex flex-col items-center justify-center text-center">
            <div id="stats" class="mb-4 grid grid-cols-2 gap-4 w-full">
                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                    <span class="block text-2xl font-black text-yellow-500" id="tag-count">0</span>
                    <span class="text-[10px] uppercase text-slate-400">Tags Read</span>
                </div>
                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                    <span class="block text-2xl font-black text-blue-400" id="read-rate">0</span>
                    <span class="text-[10px] uppercase text-slate-400">Tags/Sec</span>
                </div>
            </div>

            <button id="scan-btn" class="w-full py-8 rounded-2xl bg-yellow-500 text-slate-900 text-2xl font-black uppercase tracking-widest active:scale-95 transition-transform shadow-lg shadow-yellow-500/20">
                Start Scan
            </button>
        </section>

        <!-- Results List -->
        <section class="flex-1 flex flex-col min-h-0">
            <div class="flex justify-between items-center mb-2 px-2">
                <h2 class="text-xs font-bold uppercase text-slate-500 tracking-widest">Inventory List</h2>
                <button id="clear-btn" class="text-xs font-bold text-slate-400 hover:text-white uppercase">Clear</button>
            </div>
            
            <div id="results-container" class="flex-1 bg-slate-800 rounded-t-2xl border-t border-x border-slate-700 overflow-y-auto">
                <ul id="tag-list" class="divide-y divide-slate-700">
                    <!-- Sample Tag Item (Hidden by default or replaced) -->
                    <li class="p-4 flex flex-col gap-1 italic text-slate-500 text-sm text-center py-10" id="empty-state">
                        Waiting for scan data...
                    </li>
                </ul>
            </div>
        </section>
    </main>

    <!-- Footer Information -->
    <footer class="bg-slate-800 p-2 text-center border-t border-slate-700 shrink-0">
        <p class="text-[10px] text-slate-500">Zebra RFID Industrial Interface v1.0</p>
    </footer>

    <!-- Zebra Enterprise Browser JS Scaffolding -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ebStatus = document.getElementById('eb-status');
            const statusDot = document.getElementById('status-dot');
            const scanBtn = document.getElementById('scan-btn');
            const tagList = document.getElementById('tag-list');
            const tagCountEl = document.getElementById('tag-count');
            const emptyState = document.getElementById('empty-state');
            const clearBtn = document.getElementById('clear-btn');

            let isScanning = false;
            let tags = new Set();
            let pollInterval = null;

            function toggleScan() {
                isScanning = !isScanning;
                
                if (isScanning) {
                    startScanning();
                } else {
                    stopScanning();
                }
            }

            function startScanning() {
                scanBtn.textContent = 'Stop Listening';
                scanBtn.classList.replace('bg-yellow-500', 'bg-red-600');
                scanBtn.classList.replace('text-slate-900', 'text-white');
                statusDot.classList.add('animate-ping');

                // Start Polling the backend
                pollInterval = setInterval(fetchScans, 2000);
                fetchScans(); // Initial fetch
            }

            function stopScanning() {
                scanBtn.textContent = 'Start Listening';
                scanBtn.classList.replace('bg-red-600', 'bg-yellow-500');
                scanBtn.classList.replace('text-white', 'text-slate-900');
                statusDot.classList.remove('animate-ping');
                
                if (pollInterval) {
                    clearInterval(pollInterval);
                    pollInterval = null;
                }
            }

            async function fetchScans() {
                try {
                    const response = await fetch('/api/get-scans/');
                    const data = await response.json();
                    
                    if (data.scans && data.scans.length > 0) {
                        data.scans.forEach(scan => {
                            addTag(scan.epc, scan.rssi, scan.antenna);
                        });
                    }
                } catch (e) {
                    console.error('Failed to fetch scans', e);
                }
            }

            async function clearBackend() {
                try {
                    await fetch('/api/clear-scans/');
                    tags.clear();
                    tagCountEl.textContent = '0';
                    tagList.innerHTML = `
                        <li class="p-4 flex flex-col gap-1 italic text-slate-500 text-sm text-center py-10" id="empty-state">
                            Waiting for scan data...
                        </li>
                    `;
                } catch (e) {
                    console.error('Failed to clear scans', e);
                }
            }

            function addTag(epc, rssi, antenna) {
                if (tags.has(epc)) return;
                
                tags.add(epc);
                tagCountEl.textContent = tags.size;

                const emptyStateEl = document.getElementById('empty-state');
                if (emptyStateEl) {
                    emptyStateEl.remove();
                }

                const li = document.createElement('li');
                li.className = 'p-4 border-b border-slate-700 flex justify-between items-center animate-in fade-in slide-in-from-right-4 duration-300';
                li.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-xs text-slate-500 font-mono">EPC</span>
                        <span class="font-mono text-sm font-bold text-yellow-500">${epc}</span>
                        <div class="flex gap-2 mt-1">
                            <span class="text-[8px] uppercase px-1 bg-slate-700 rounded text-slate-300">Ant: ${antenna || 1}</span>
                            <span class="text-[8px] uppercase px-1 bg-slate-700 rounded text-slate-300">RSSI: ${rssi || 'N/A'}</span>
                        </div>
                    </div>
                    <span class="text-[10px] bg-green-500/20 text-green-400 px-2 py-1 rounded border border-green-500/30 font-bold">DETECTED</span>
                `;
                tagList.prepend(li);
            }

            scanBtn.addEventListener('click', toggleScan);
            clearBtn.addEventListener('click', clearBackend);
        });
    </script>
</body>
</html>
